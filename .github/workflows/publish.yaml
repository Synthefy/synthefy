name: Publish to PyPI

# Publishes the package to PyPI using OIDC "trusted publishing": GitHub mints a
# short-lived OIDC token at runtime and exchanges it with PyPI, so NO PyPI API
# token / TWINE_PASSWORD secret is ever stored in this repository.
#
# ── One-time setup on PyPI (required before the first release) ───────────────
# Register a GitHub trusted publisher for the `synthefy` project at:
#     https://pypi.org/manage/project/synthefy/settings/publishing/
# (for a brand-new project with no uploads yet, use the "pending publisher"
#  form at https://pypi.org/manage/account/publishing/)
# with EXACTLY these values:
#     PyPI Project Name: synthefy
#     Owner:             Synthefy
#     Repository name:   synthefy
#     Workflow name:     publish.yaml
#     Environment name:  pypi
# The owner/repo/workflow must match this file's location, and the environment
# must match the `environment:` block in the publish job below.
#
# ── Cutting a release ────────────────────────────────────────────────────────
# 1. Bump `version` in pyproject.toml and `__version__` in src/synthefy/__init__.py.
# 2. Create a GitHub Release (e.g. tag v3.1.0). Publishing the release triggers
#    this workflow, which builds the package and uploads it to PyPI.

on:
  release:
    types: [published]   # fires when a GitHub Release is published
  workflow_dispatch: {}  # also allow manual runs from the Actions tab

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Build sdist and wheel
        run: uv build

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    # Trusted publishing on PyPI is scoped to this environment. Keeping the
    # publish step in its own environment also lets you add required reviewers
    # or branch protections to release uploads.
    environment:
      name: pypi
      url: https://pypi.org/project/synthefy/
    permissions:
      id-token: write   # REQUIRED for OIDC trusted publishing; no secrets needed
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
