name: Tests

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies
        run: |
          uv sync --dev --extra text

      - name: Run unit tests
        run: |
          uv run pytest tests/ --ignore=tests/online_tests -v --tb=short

      - name: Build and validate distributions
        run: |
          uv build
          uv run twine check dist/*

      - name: Run online API tests
        env:
          SYNTHEFY_API_KEY: ${{ secrets.SYNTHEFY_API_KEY }}
        run: |
          uv run pytest tests/online_tests -v --tb=short
