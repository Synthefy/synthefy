name: Tests

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: nori_rel_test
          POSTGRES_PASSWORD: integration
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nori_rel_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NORI_REL_TEST_DATABASE_URL: postgresql://postgres:integration@127.0.0.1:5432/nori_rel_test
      NORI_REL_TEST_MANAGED: "1"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies
        run: |
          uv sync --dev --extra text --extra relational

      - name: Run unit tests
        run: |
          uv run pytest tests/ --ignore=tests/online_tests -v --tb=short

      - name: Check relational code
        run: |
          uv run ruff check --select E,F,I,B,SIM src/synthefy/relational tests/test_relational_*.py
          uv run ruff format --check src/synthefy/relational tests/test_relational_*.py

      - name: Build and validate distributions
        run: |
          uv build
          uv run twine check dist/*

      - name: Run online API tests
        env:
          SYNTHEFY_API_KEY: ${{ secrets.SYNTHEFY_API_KEY }}
        run: |
          uv run pytest tests/online_tests -v --tb=short
