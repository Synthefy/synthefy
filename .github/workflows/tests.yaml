name: Tests

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies
        run: |
          uv sync --dev

      - name: Run unit tests
        run: |
          uv run pytest tests/ --ignore=tests/use_cases -v --tb=short

      - name: Run use case tests
        env:
          SYNTHEFY_API_KEY: ${{ secrets.SYNTHEFY_API_KEY }}
        run: |
          uv run pytest tests/use_cases -v --tb=short
